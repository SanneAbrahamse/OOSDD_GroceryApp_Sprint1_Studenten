name: MAUI Unit Tests

on:
  push:
    branches:
      - main
      - infra/runner-toevoegen
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - name: Haal de repository op
        uses: actions/checkout@v4

      - name: Installeer .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Installeer MAUI workloads
        run: dotnet workload install maui-android maui-ios maui-maccatalyst

      - name: Restore afhankelijkheden
        run: dotnet restore

      - name: Restore workloads
        run: dotnet workload restore

      - name: Bouw de applicatie
        run: dotnet build ./Grocery.App/Grocery.App.csproj -c Release --no-restore

      - name: Voer unit tests uit
        run: dotnet test --configuration Release --no-build --verbosity normal